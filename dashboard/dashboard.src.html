<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Level Up Command Center</title>
<meta name="description" content="Paste your AI Level Up save code to see your level, skill matrix, quests and badges, and to gear up your operative.">
<style>
  :root {
    color-scheme: dark;
    --bg: #05040a;
    --panel: #0b0915;
    --panel-2: #110e1f;
    --line: #2a2342;
    --line-2: #3a3058;
    --text: #ece9f7;
    --muted: #8d86a8;
    --cyan: #00f0ff;
    --mag: #ff2bd6;
    --acid: #f6ff3b;
    --good: #5dff9b;
    --warn: #ffb020;
    --bad: #ff3b6b;
    --gold: #ffd84a;
    --accent: var(--cyan);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cut: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(900px 520px at 85% -8%, rgba(255, 43, 214, .14), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(0, 240, 255, .10), transparent 60%);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* Neon floor grid and scanlines */
  .floor { position: fixed; left: -50%; right: -50%; bottom: -10vh; height: 55vh; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(255, 43, 214, .28) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 43, 214, .28) 1px, transparent 1px);
    background-size: 64px 64px; transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%); opacity: .35;
    animation: floor 6s linear infinite; }
  @keyframes floor { to { background-position: 0 64px, 0 0; } }
  .scan { position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 16px 56px; }

  .eyebrow { font: 700 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
  h1, h2, h3 { margin: 0; font-weight: 700; }

  /* Ticker */
  .ticker { position: relative; z-index: 2; overflow: hidden; border-bottom: 1px solid var(--line); background: rgba(5, 4, 10, .85);
    font: 600 11px/30px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .ticker .run { display: inline-block; padding-left: 100%; animation: tick 60s linear infinite; }
  .ticker b { color: var(--acid); font-weight: 700; }
  .ticker i { font-style: normal; color: var(--mag); margin: 0 14px; }
  @keyframes tick { to { transform: translateX(-100%); } }

  /* Top bar and tabs */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 26px; height: 26px; }
  .brand b { font: 800 14px/1 var(--mono); letter-spacing: .22em; }
  .brand span { color: var(--mag); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { font: 700 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; padding: 10px 14px; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 0;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .tab:hover { color: var(--text); border-color: var(--line-2); }
  .tab[aria-selected="true"] { color: #05040a; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 18px rgba(0, 240, 255, .5); }
  .tab .n { color: var(--mag); margin-left: 6px; }
  .tab[aria-selected="true"] .n { color: #05040a; }

  /* Panels: cut corners and a neon tab on the top edge */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; }
  .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
  @media (max-width: 900px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } }
  .panel { position: relative; background: var(--line); padding: 1px;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
  .panel > .in { position: relative; height: 100%; padding: 18px;
    background: linear-gradient(180deg, rgba(17, 14, 31, .97), rgba(11, 9, 21, .97));
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
  .panel::before { content: ""; position: absolute; left: 18px; top: 0; width: 56px; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); z-index: 2; }
  .panel.hot::before { background: var(--mag); box-shadow: 0 0 10px var(--mag); }
  .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .ph h2 { font: 700 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .ph h2::before { content: "// "; color: var(--mag); }
  .ph .meta { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .08em; }

  /* Glitch callsign */
  .glitch { position: relative; display: inline-block; font: 800 34px/1.05 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    overflow-wrap: anywhere; text-shadow: 0 0 18px rgba(0, 240, 255, .35); }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; }
  .glitch::before { color: var(--mag); clip-path: inset(0 0 58% 0); animation: g1 4s infinite steps(1); opacity: .85; }
  .glitch::after { color: var(--cyan); clip-path: inset(52% 0 0 0); animation: g2 4s infinite steps(1); opacity: .85; }
  @keyframes g1 { 0%, 90% { transform: none; } 91% { transform: translate(3px, -1px); } 94% { transform: translate(-3px, 1px); } 97% { transform: translate(2px, 0); } }
  @keyframes g2 { 0%, 90% { transform: none; } 92% { transform: translate(-3px, 1px); } 95% { transform: translate(3px, -1px); } 98% { transform: translate(-1px, 0); } }

  /* Hero */
  .hero { display: grid; grid-template-columns: 150px minmax(0, 1fr) 130px 200px; gap: 22px; align-items: center; }
  @media (max-width: 1000px) { .hero { grid-template-columns: 120px minmax(0, 1fr) 120px; } .hero .scorebox { grid-column: 1 / -1; text-align: left; } }
  @media (max-width: 620px) { .hero { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; } .hero .ringbox { grid-column: 1; } .hero .scorebox { grid-column: 2; } .score { font-size: 36px; } .glitch { font-size: 24px; } }
  .hero .av { display: block; width: 100%; filter: drop-shadow(0 0 18px rgba(0, 240, 255, .18)); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font: 700 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; padding: 6px 8px; border: 1px solid var(--line-2); color: var(--muted); }
  .tag.tier { color: var(--cyan); border-color: rgba(0, 240, 255, .5); background: rgba(0, 240, 255, .07); }
  .tag.cls { color: var(--mag); border-color: rgba(255, 43, 214, .5); background: rgba(255, 43, 214, .07); }
  .tag.star { color: var(--gold); border-color: rgba(255, 216, 74, .5); }
  .xpline { margin-top: 14px; }
  .xpmeta { display: flex; justify-content: space-between; gap: 8px; font: 12px/1 var(--mono); color: var(--muted); margin-bottom: 7px; flex-wrap: wrap; }
  .bar { height: 8px; background: #191428; overflow: hidden; clip-path: polygon(0 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mag), var(--cyan)); box-shadow: 0 0 12px rgba(0, 240, 255, .55); }
  .bar.seg > i { background: repeating-linear-gradient(90deg, var(--cyan) 0 10px, transparent 10px 12px); }
  .ringbox { text-align: center; }
  .ringbox svg { width: 100%; max-width: 130px; display: block; margin: 0 auto; }
  .ringlbl { font: 700 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); margin-top: 6px; }
  .scorebox { text-align: right; }
  .kv { font: 700 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .score { font: 800 46px/1 var(--mono); margin-top: 6px; text-shadow: 0 0 22px rgba(255, 43, 214, .35); }
  .score small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .delta { font: 700 12px/1 var(--mono); margin-top: 6px; }
  .credits { margin-top: 14px; font: 800 20px/1 var(--mono); color: var(--acid); text-shadow: 0 0 14px rgba(246, 255, 59, .4); }
  .credits small { font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .mirror { margin-top: 10px; font: 700 10px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .mirror i { font-style: normal; color: var(--cyan); letter-spacing: .2em; margin: 0 6px; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }

  /* Charts */
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis text { fill: var(--muted); font: 10px var(--mono); }
  .axis path, .axis line { stroke: var(--line-2); }
  .matrix { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: center; }
  @media (max-width: 620px) { .matrix { grid-template-columns: minmax(0, 1fr); } }
  .tlist { display: grid; gap: 8px; }
  .tl { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center; }
  .tl .nm { font-size: 13px; overflow-wrap: anywhere; }
  .tl .v { font: 700 12px/1 var(--mono); text-align: right; }
  .tl .bar { grid-column: 1 / -1; height: 5px; }
  .tl.weak .nm::after { content: " · WEAKEST"; font: 700 9px/1 var(--mono); letter-spacing: .12em; color: var(--warn); }
  .tl.weak .bar > i { background: linear-gradient(90deg, #b8640c, var(--warn)); box-shadow: 0 0 10px rgba(255, 176, 32, .5); }
  .tl.top .nm::after { content: " · CLASS"; font: 700 9px/1 var(--mono); letter-spacing: .12em; color: var(--mag); }
  .tl.dormant .nm, .tl.dormant .v { color: var(--muted); }
  .tl.dormant .v { font-size: 9px; letter-spacing: .1em; }
  .tip { position: fixed; z-index: 60; pointer-events: none; padding: 7px 9px; font: 600 11px/1.3 var(--mono); color: var(--text);
    background: #0b0915; border: 1px solid var(--cyan); box-shadow: 0 0 14px rgba(0, 240, 255, .35); opacity: 0; transition: opacity .12s; max-width: 240px; }

  /* Quests */
  .qgroup + .qgroup { margin-top: 16px; }
  .qlabel { font: 700 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .quest { border: 1px solid var(--line); padding: 12px; background: rgba(255, 255, 255, .015); border-left: 2px solid var(--cyan); }
  .quest + .quest { margin-top: 8px; }
  .quest.boss { border-left-color: var(--bad); background: rgba(255, 59, 107, .05); }
  .quest.weekly { border-left-color: var(--mag); }
  .quest.daily { border-left-color: var(--acid); }
  .quest.done { opacity: .6; }
  .quest.locked { opacity: .45; }
  .qtop { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
  .qid { font: 700 11px/1 var(--mono); color: var(--cyan); margin-right: 8px; }
  .qtitle { font-weight: 650; }
  .qreward { font: 700 11px/1.3 var(--mono); color: var(--good); text-align: right; }
  .qcrit { color: var(--muted); font-size: 13px; margin: 6px 0 8px; }
  .qprog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font: 12px/1 var(--mono); color: var(--muted); }

  /* Platform, log, directive */
  .stack { display: grid; gap: 16px; align-content: start; }
  .plat { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; }
  .plat-app { font-weight: 700; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 11px/1 var(--mono); padding: 5px 7px; border: 1px solid var(--line-2); color: var(--muted); }
  .unlocks { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: u; }
  .unlocks li { counter-increment: u; position: relative; padding: 7px 0 7px 28px; font-size: 13px; border-top: 1px dashed var(--line); }
  .unlocks li::before { content: counter(u); position: absolute; left: 0; top: 8px; width: 18px; height: 18px; display: grid; place-items: center;
    font: 800 10px/1 var(--mono); background: rgba(0, 240, 255, .12); color: var(--cyan); }
  .directive { border-left: 2px solid var(--cyan); padding-left: 12px; }
  .directive + .directive { margin-top: 14px; }
  .directive.obstacle { border-color: var(--warn); }
  .directive h3 { font: 700 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .log li:last-child { border-bottom: 0; }
  .log .d { font: 12px/1.4 var(--mono); color: var(--muted); }
  .log .x { font: 700 12px/1.4 var(--mono); color: var(--good); white-space: nowrap; }
  .ev { font: 700 9px/1 var(--mono); padding: 2px 4px; border: 1px solid var(--line-2); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }

  /* Milestones, insignia, badges */
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .track { border: 1px solid var(--line); padding: 12px; }
  .track-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .track b { font-size: 13px; }
  .rank { font: 800 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; border: 1px solid currentColor; }
  .r0 { color: var(--muted); opacity: .7; } .r1 { color: #e08d58; } .r2 { color: #c9d2e0; } .r3 { color: var(--gold); } .r4 { color: #b8f4ff; text-shadow: 0 0 10px rgba(184, 244, 255, .7); }
  .track .sub { font: 11px/1.3 var(--mono); color: var(--muted); margin: 6px 0 8px; }
  .insignia { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .ins { font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 7px 9px; border: 1px solid var(--line); color: var(--muted); opacity: .45; }
  .ins.on { opacity: 1; color: var(--cyan); border-color: rgba(0, 240, 255, .45); background: rgba(0, 240, 255, .06); }
  .ins.prestige.on { color: var(--gold); border-color: rgba(255, 216, 74, .5); background: rgba(255, 216, 74, .07); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .badge { border: 1px solid var(--line); padding: 12px 10px; text-align: center; }
  .badge .ico { display: block; width: 30px; height: 30px; margin: 0 auto 8px; }
  .badge b { display: block; font-size: 13px; }
  .badge span { display: block; font: 11px/1.3 var(--mono); color: var(--muted); margin-top: 4px; }
  .badge.locked { opacity: .38; filter: grayscale(1); }
  .sub2 { margin: 18px 0 10px; }

  /* Operative + Armory */
  .bay { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .bay { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: sticky; top: 12px; }
  @media (max-width: 900px) { .stage { position: static; } }
  .stage .av { display: block; width: 100%; max-width: 320px; margin: 0 auto; }
  .stage-cap { text-align: center; margin-top: 12px; }
  .stage-cap .nm { font: 800 18px/1.1 var(--mono); letter-spacing: .06em; text-transform: uppercase; overflow-wrap: anywhere; }
  .stage-cap .ds { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot { border: 1px solid var(--line); padding: 10px; min-height: 64px; }
  .slot .k { font: 700 9px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .slot .v { margin-top: 6px; font-size: 13px; font-weight: 650; }
  .slot .v.none { color: var(--muted); font-weight: 400; }
  .look { display: grid; gap: 14px; }
  .look .k { font: 700 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw button { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line-2); cursor: pointer; border-radius: 0; }
  .sw button[aria-pressed="true"] { outline: 2px solid var(--cyan); outline-offset: 2px; box-shadow: 0 0 12px rgba(0, 240, 255, .6); }
  .sw .txt { width: auto; padding: 0 10px; font: 700 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text); background: transparent; }
  .classcard { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; border: 1px solid rgba(255, 43, 214, .4); background: rgba(255, 43, 214, .05); padding: 12px; }
  .classcard svg { width: 48px; height: 48px; }
  .classcard b { font: 800 14px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mag); }
  .classcard p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters button { font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 8px 10px; cursor: pointer; border-radius: 0;
    background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .filters button[aria-pressed="true"] { color: var(--mag); border-color: var(--mag); background: rgba(255, 43, 214, .08); }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .item { position: relative; text-align: left; padding: 0; cursor: pointer; color: var(--text); background: #0d0b18; border: 1px solid var(--line); border-radius: 0; font: inherit; }
  .item:hover { border-color: var(--line-2); }
  .item[aria-pressed="true"] { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(0, 240, 255, .25); }
  .item .th { display: block; width: 100%; aspect-ratio: 5 / 4; overflow: hidden; background: #08060f; }
  .item .th svg { width: 100%; height: 100%; display: block; }
  .item .body { display: block; padding: 9px 10px 10px; border-top: 2px solid var(--rc, var(--line)); }
  .item .nm { display: block; font-size: 13px; font-weight: 650; line-height: 1.25; }
  .item .rr { display: block; font: 700 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--rc, var(--muted)); margin-top: 6px; }
  .item .st { display: block; font: 700 11px/1 var(--mono); margin-top: 8px; color: var(--acid); }
  .item .st.own { color: var(--good); } .item .st.lock { color: var(--muted); } .item .st.eq { color: var(--cyan); }
  .item.locked .th { filter: grayscale(1) brightness(.6); }
  .rar-common { --rc: #9aa3b8; } .rar-uncommon { --rc: #5dff9b; } .rar-rare { --rc: #00f0ff; } .rar-epic { --rc: #ff2bd6; } .rar-legendary { --rc: #ffd84a; } .rar-earned { --rc: #f6ff3b; }
  .detail { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .detail .nm { font: 800 15px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .detail p { margin: 6px 0 12px; color: var(--muted); font-size: 13px; }
  .perks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .perk { border: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; align-content: start; }
  .perk b { font: 800 13px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .perk p { margin: 0; font-size: 13px; color: var(--muted); }
  .perk .use { font: 11px/1.4 var(--mono); color: var(--muted); }
  .perk .use code { color: var(--cyan); }
  .perk .ct { font: 700 11px/1 var(--mono); color: var(--good); }

  /* Sync bar */
  .sync { position: sticky; bottom: 12px; z-index: 30; margin-top: 18px; display: none; }
  .sync.on { display: block; }
  .sync .in { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: #120c1d; }
  .sync p { margin: 0; font-size: 13px; }
  .sync p b { color: var(--acid); }
  .sync textarea { min-height: 70px; margin-top: 10px; flex-basis: 100%; }

  /* Buttons, inputs, loader */

    x_storm: c => d3.range(5).map(i => '<circle cx="100" cy="92" r="' + (40 + i * 22) + '" fill="none" stroke="' + c.A + '" stroke-opacity="' + (0.5 - i * 0.08) + '" stroke-dasharray="' + (2 + i * 3) + " " + (4 + i * 2) + '"' + (i % 2 ? ' class="pulse"' : "") + "/>").join("") +
      d3.range(26).map(i => '<text x="' + (rnd(i) * 190).toFixed(1) + '" y="' + (rnd(i + 11) * 236).toFixed(1) + '" font-family="monospace" font-size="7" fill="' + c.A + '" opacity=".35">' + (rnd(i + 3) > 0.5 ? "01" : "10") + "</text>").join(""),
    x_ice: c => '<rect width="200" height="240" fill="#05030a"/><rect width="200" height="240" fill="url(#' + c.id + 'h)"/>' +
      '<rect width="200" height="240" fill="url(#' + c.id + 'h)" class="pulse" opacity=".8"/><text x="8" y="232" font-family="monospace" font-size="7" letter-spacing="2" fill="#ff3b6b" opacity=".7">ICE ACTIVE</text>',
    x_plat: c => '<circle cx="100" cy="96" r="110" fill="#cfefff" opacity=".08"/>' + d3.range(12).map(i => {
      const a = i / 12 * Math.PI * 2; return '<line x1="100" y1="96" x2="' + (100 + Math.cos(a) * 160).toFixed(1) + '" y2="' + (96 + Math.sin(a) * 160).toFixed(1) + '" stroke="#cfefff" stroke-opacity=".12" stroke-width="6"/>';
    }).join("")
  };
  function classIcon(key, color) {
    return '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="' + CLASSES[key][2] + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  }
  function badgeIcon(on) {
    return '<svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 L27 9 V21 L15 28 L3 21 V9 Z" fill="' + (on ? "rgba(0,240,255,.12)" : "none") + '" stroke="' + (on ? "#00f0ff" : "#8d86a8") + '" stroke-width="1.5"/>' +
      (on ? '<path d="M15 8 L21 15 L15 22 L9 15 Z" fill="#00f0ff"/>' : "") + "</svg>";
  }

  // ---------- D3 charts ----------
  function drawRing(el, pct, level) {
    const svg = d3.select(el).append("svg").attr("viewBox", "0 0 130 130").attr("role", "img").attr("aria-label", "Level " + level + ", " + Math.round(pct) + "% to next level");
    const defs = svg.append("defs");
    const lg = defs.append("linearGradient").attr("id", "ringg").attr("x1", 0).attr("x2", 1).attr("y1", 0).attr("y2", 1);
    lg.append("stop").attr("offset", 0).attr("stop-color", "#ff2bd6");
    lg.append("stop").attr("offset", 1).attr("stop-color", "#00f0ff");
    const g = svg.append("g").attr("transform", "translate(65,65)");
    g.selectAll("line").data(d3.range(48)).join("line")
      .attr("x1", 0).attr("x2", 0).attr("y1", -62).attr("y2", d => d % 4 ? -59 : -56)
      .attr("transform", d => "rotate(" + d * 7.5 + ")").attr("stroke", "#3a3058");
    const arc = d3.arc().innerRadius(44).outerRadius(52);
    g.append("path").attr("d", arc({ startAngle: 0, endAngle: Math.PI * 2 })).attr("fill", "#1a1430");
    const fg = g.append("path").attr("fill", "url(#ringg)").style("filter", "drop-shadow(0 0 6px rgba(0,240,255,.6))");
    const end = Math.max(0.02, pct / 100) * Math.PI * 2;
    fg.transition().duration(MOTION ? 1300 : 0).ease(d3.easeCubicOut)
      .attrTween("d", () => { const i = d3.interpolate(0, end); return t => arc({ startAngle: 0, endAngle: i(t) }); });
    g.append("text").attr("y", -10).attr("text-anchor", "middle").attr("fill", "#8d86a8").style("font", "700 9px var(--mono)").style("letter-spacing", ".2em").text("LEVEL");
    g.append("text").attr("y", 22).attr("text-anchor", "middle").attr("fill", "#ece9f7").style("font", "800 34px var(--mono)").text(level);
  }

  function drawRadar(el, D) {
    const W = 400, H = 360, cx = W / 2, cy = H / 2, R = 118, n = TREES.length;
    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 10, cy + Math.sin(ang(i)) * R * v / 10];
    const svg = d3.select(el).append("svg").attr("viewBox", "0 0 " + W + " " + H).attr("role", "img").attr("aria-label", "Skill matrix radar chart");
    const defs = svg.append("defs");
    const rg = defs.append("radialGradient").attr("id", "radg");
    rg.append("stop").attr("offset", 0).attr("stop-color", "#ff2bd6").attr("stop-opacity", .05);
    rg.append("stop").attr("offset", 1).attr("stop-color", "#00f0ff").attr("stop-opacity", .35);
    [2, 4, 6, 8, 10].forEach(v => {
      svg.append("polygon").attr("points", TREES.map((t, i) => pt(i, v).join(",")).join(" "))
        .attr("fill", v === 10 ? "rgba(255,255,255,.015)" : "none").attr("stroke", v === 10 ? "#3a3058" : "#241d3a");
    });
    [2, 4, 6, 8].forEach(v => svg.append("text").attr("x", cx + 3).attr("y", cy - R * v / 10 - 2).attr("fill", "#5c5578").style("font", "9px var(--mono)").text(v));
    TREES.forEach((t, i) => {
      const dorm = D.dormant(t[0]);
      const e = pt(i, 10);
      svg.append("line").attr("x1", cx).attr("y1", cy).attr("x2", e[0]).attr("y2", e[1]).attr("stroke", dorm ? "#3a3058" : "#2c2545").attr("stroke-dasharray", dorm ? "3 4" : null);
      const l = pt(i, 12.4), cos = Math.cos(ang(i));
      const anchor = Math.abs(cos) < 0.2 ? "middle" : cos > 0 ? "start" : "end";
      const tx = svg.append("text").attr("x", l[0]).attr("y", l[1]).attr("text-anchor", anchor).attr("dominant-baseline", "middle");
      tx.append("tspan").attr("x", l[0]).attr("fill", dorm ? "#5c5578" : (D.strongest === t ? "#ff2bd6" : "#c9c3e0")).style("font", "700 11px var(--mono)").style("letter-spacing", ".06em").text(t[2].toUpperCase());
      tx.append("tspan").attr("x", l[0]).attr("dy", 13).attr("fill", dorm ? "#5c5578" : (D.weakest === t ? "#ffb020" : "#00f0ff")).style("font", "700 11px var(--mono)")
        .text(dorm ? "DORMANT" : num(D.trees[t[0]]).toFixed(1));
    });
    const vals = TREES.map(t => D.dormant(t[0]) ? 0 : clamp(num(D.trees[t[0]]), 0, 10));
    const line = d3.line().curve(d3.curveLinearClosed);
    const shape = svg.append("g").attr("transform", "translate(" + cx + "," + cy + ") scale(" + (MOTION ? 0 : 1) + ")");
    const rel = vals.map((v, i) => { const p = pt(i, v); return [p[0] - cx, p[1] - cy]; });
    shape.append("path").attr("d", line(rel)).attr("fill", "url(#radg)").attr("stroke", "#00f0ff").attr("stroke-width", 2).style("filter", "drop-shadow(0 0 6px rgba(0,240,255,.55))");
    shape.selectAll("circle").data(TREES).join("circle")
      .attr("cx", (t, i) => rel[i][0]).attr("cy", (t, i) => rel[i][1]).attr("r", 4.5)
      .attr("fill", t => D.weakest === t ? "#ffb020" : D.strongest === t ? "#ff2bd6" : "#00f0ff").attr("stroke", "#05040a").attr("stroke-width", 1.5)
      .style("cursor", "default")
      .on("mousemove", (e, t) => showTip(e, esc(t[1]) + "<br>" + (D.dormant(t[0]) ? "Dormant: no evidence yet" : num(D.trees[t[0]]).toFixed(1) + " / 10")))
      .on("mouseleave", hideTip);
    if (MOTION) shape.transition().duration(1000).ease(d3.easeBackOut.overshoot(1.2)).attr("transform", "translate(" + cx + "," + cy + ") scale(1)");
  }

  function drawHistory(el, hist) {
    const p = d3.timeParse("%Y-%m-%d");
    const data = (hist || []).map(h => ({ d: p(String(h.date || "").slice(0, 10)), v: num(h.score), r: h.reason })).filter(x => x.d).sort((a, b) => a.d - b.d);
    if (data.length < 2) { el.innerHTML = '<p class="empty">Score history appears after your next evaluation.</p>'; return; }
    const W = 520, H = 180, m = { t: 14, r: 14, b: 26, l: 30 };
    const x = d3.scaleTime().domain(d3.extent(data, d => d.d)).range([m.l, W - m.r]);
    const lo = d3.min(data, d => d.v), hi = d3.max(data, d => d.v);
    const y = d3.scaleLinear().domain([Math.max(0, lo - 0.5), Math.min(10, hi + 0.3)]).nice().range([H - m.b, m.t]);
    const svg = d3.select(el).append("svg").attr("viewBox", "0 0 " + W + " " + H).attr("role", "img").attr("aria-label", "Score history line chart");
    const lg = svg.append("defs").append("linearGradient").attr("id", "histg").attr("x1", 0).attr("x2", 0).attr("y1", 0).attr("y2", 1);
    lg.append("stop").attr("offset", 0).attr("stop-color", "#ff2bd6").attr("stop-opacity", .35);
    lg.append("stop").attr("offset", 1).attr("stop-color", "#ff2bd6").attr("stop-opacity", 0);
    svg.append("g").attr("class", "axis").attr("transform", "translate(0," + (H - m.b) + ")")
      .call(d3.axisBottom(x).ticks(Math.min(5, data.length)).tickFormat(d3.timeFormat("%b %d")).tickSizeOuter(0));
    svg.append("g").attr("class", "axis").attr("transform", "translate(" + m.l + ",0)").call(d3.axisLeft(y).ticks(4).tickSize(-(W - m.l - m.r)))
      .call(g => g.selectAll(".tick line").attr("stroke", "#1f1934")).call(g => g.select(".domain").remove());
    svg.append("path").datum(data).attr("fill", "url(#histg)").attr("d", d3.area().x(d => x(d.d)).y0(H - m.b).y1(d => y(d.v)).curve(d3.curveMonotoneX));
    const path = svg.append("path").datum(data).attr("fill", "none").attr("stroke", "#ff2bd6").attr("stroke-width", 2.5)
      .style("filter", "drop-shadow(0 0 5px rgba(255,43,214,.7))").attr("d", d3.line().x(d => x(d.d)).y(d => y(d.v)).curve(d3.curveMonotoneX));
    if (MOTION) {
      const L = path.node().getTotalLength();
      path.attr("stroke-dasharray", L + " " + L).attr("stroke-dashoffset", L).transition().duration(1200).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0);
    }
    svg.selectAll("circle").data(data).join("circle").attr("cx", d => x(d.d)).attr("cy", d => y(d.v)).attr("r", 4)
      .attr("fill", "#05040a").attr("stroke", "#00f0ff").attr("stroke-width", 2)
      .on("mousemove", (e, d) => showTip(e, d3.timeFormat("%b %d, %Y")(d.d) + " · <b>" + d.v.toFixed(1) + "</b><br>" + esc(d.r || "")))
      .on("mouseleave", hideTip);
  }

  function drawCoverage(el, used, avail) {
    const svg = d3.select(el).append("svg").attr("viewBox", "0 0 120 120").attr("role", "img").attr("aria-label", used + " of " + avail + " feature areas in use");
    const g = svg.append("g").attr("transform", "translate(60,60)");
    const arcs = d3.pie().value(1).padAngle(0.06).sort(null)(d3.range(avail));
    const arc = d3.arc().innerRadius(38).outerRadius(52);
    g.selectAll("path").data(arcs).join("path").attr("d", arc)
      .attr("fill", (d, i) => i < used ? "#00f0ff" : "#1f1934")
      .style("filter", (d, i) => i < used ? "drop-shadow(0 0 4px rgba(0,240,255,.6))" : null)
      .attr("opacity", MOTION ? 0 : 1)
      .transition().delay((d, i) => MOTION ? i * 60 : 0).duration(MOTION ? 300 : 0).attr("opacity", 1);
    g.append("text").attr("y", 8).attr("text-anchor", "middle").attr("fill", "#ece9f7").style("font", "800 22px var(--mono)").text(used + "/" + avail);
  }

  // ---------- Views ----------
  function ticker(s, D) {
    const bits = [
      "<b>" + esc(s.player || "Operative") + "</b> online", "Class <b>" + esc(D.cls[0]) + "</b>", "Level <b>" + D.level + "</b> · " + tierFor(D.level),
      "Credits <b>" + D.credits.toLocaleString() + "</b>"
    ].concat((s.log || []).slice(0, 4).map(l => esc(l.event) + " <b>+" + num(l.xp) + " XP</b>"));
    if (s.next_action) bits.push("Next: " + esc(s.next_action));
    const line = bits.join("<i>◆</i>") + "<i>◆</i>";
    document.getElementById("ticker").innerHTML = '<div class="ticker" aria-hidden="true"><span class="run">' + line + line + "</span></div>";
  }

  function topbar(D) {
    const tab = (k, label, extra) => '<button class="tab" role="tab" type="button" data-view="' + k + '" aria-selected="' + (view === k) + '">' + label + (extra || "") + "</button>";
    return '<div class="topbar"><div class="brand"><svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 1 L25 8 V18 L13 25 L1 18 V8 Z" fill="none" stroke="#00f0ff" stroke-width="1.6"/><path d="M8 17 L13 7 L18 17 M10 14 H16" fill="none" stroke="#ff2bd6" stroke-width="1.8"/></svg>' +
      "<b>AI LEVEL UP <span>//</span> CMD</b></div>" +
      '<div class="tabs" role="tablist">' + tab("command", "Command") + tab("operative", "Operative") + tab("armory", "Armory", '<span class="n">' + D.credits.toLocaleString() + " CR</span>") + "</div>" +
      '<span class="stamp">Last eval ' + esc(S.last_eval || "—") + ' <button id="swap" type="button">Load save</button></span></div>';
  }

  function commandView(s, D) {
    const score = num(s.score), prev = s.prev_score == null ? null : num(s.prev_score);
    const delta = prev == null ? 0 : Math.round((score - prev) * 10) / 10;
    const dcls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    const dtxt = prev == null ? "baseline" : (delta > 0 ? "▲ " : delta < 0 ? "▼ " : "■ ") + Math.abs(delta).toFixed(1) + " from " + prev.toFixed(1);
    const pct = (D.into / D.per) * 100;
    const mScore = clamp(Math.round(num(D.mirror.score)), 0, 5);
    const mirror = '<div class="mirror">MIRROR<i>' + "◉◉◉◉◉".slice(0, mScore) + "○○○○○".slice(0, 5 - mScore) + "</i>" + (D.mirror.date || D.mirror.score ? mScore + "/5" : "not run") + "</div>";

    const hero = '<div class="hero">' +
      '<div class="avbox">' + avatar(D.ar.look, D.ar.equipped, { cls: D.strongest && D.strongest[0], label: (s.player || "Operative") + " avatar" }) + "</div>" +
      '<div><h1 class="glitch" data-text="' + esc(s.player || "Unnamed") + '">' + esc(s.player || "Unnamed") + "</h1>" +
        '<div class="tags"><span class="tag tier">' + tierFor(D.level) + '</span><span class="tag cls">' + esc(D.cls[0]) + "</span>" +
        (D.prestige ? '<span class="tag star">' + (D.prestige > 5 ? "★×" + D.prestige : "★★★★★".slice(0, D.prestige)) + " Prestige " + D.prestige + "</span>" : "") + "</div>" +
        '<div class="xpline"><div class="xpmeta"><span>' + (D.prestige ? D.season.toLocaleString() + " season · " : "") + D.xp.toLocaleString() + " lifetime XP</span><span>" + D.into + " / " + D.per + " → LVL " + (D.level + 1) + "</span></div>" + bar(pct, "seg") + "</div></div>" +
      '<div class="ringbox" id="ring"></div>' +
      '<div class="scorebox"><div class="kv">Power Score</div><div class="score">' + score.toFixed(1) + '<small> / 10</small></div><div class="delta ' + dcls + '">' + dtxt + "</div>" + mirror +
        '<div class="credits">' + D.credits.toLocaleString() + "<small>CREDITS</small></div></div></div>";

    const tl = TREES.map(t => {
      const dorm = D.dormant(t[0]), v = num(D.trees[t[0]]);
      return '<div class="tl' + (dorm ? " dormant" : t === D.weakest ? " weak" : t === D.strongest ? " top" : "") + '"><span class="nm">' + t[1] + '</span><span class="v">' + (dorm ? "DORMANT" : v.toFixed(1)) + "</span>" + bar(dorm ? 0 : v * 10) + "</div>";
    }).join("");

    const quests = Array.isArray(s.quests) ? s.quests : [];
    const qHtml = QTYPES.map(qt => {
      const list = quests.filter(q => (q.type || "main") === qt[0]);
      if (!list.length) return "";
      return '<div class="qgroup"><div class="qlabel">' + qt[1] + "</div>" + list.map(q => {
        const total = Math.max(1, num(q.total, 1)), done = clamp(num(q.done), 0, total);
        let st = String(q.status || "active").toLowerCase();
        if (st === "complete" || st === "completed") st = "done";
        return '<div class="quest ' + esc(qt[0]) + " " + esc(st) + '"><div class="qtop"><div><span class="qid">' + esc(q.id) + '</span><span class="qtitle">' + esc(q.title) + "</span></div>" +
          '<span class="qreward">' + esc(q.reward) + "</span></div>" + (q.criteria ? '<div class="qcrit">' + esc(q.criteria) + "</div>" : "") +
          '<div class="qprog">' + bar((done / total) * 100) + "<span>" + (st === "done" ? "COMPLETE" : st === "locked" ? "LOCKED" : done + "/" + total) + "</span></div></div>";
      }).join("") + "</div>";
    }).join("") || '<p class="empty">No quests yet. Ask your game master for a Quest Board.</p>';

    const p = s.platform || {}, inUse = Array.isArray(p.in_use) ? p.in_use : [], avail = clamp(Math.round(num(p.available, 10)), 1, 10);
    const plat = p.app && (inUse.length || (p.next || []).length)
      ? '<div class="plat"><div class="chart" id="cov"></div><div><div class="plat-app">' + esc(p.app) + (p.plan ? " · " + esc(p.plan) : "") + "</div>" +
        (inUse.length ? '<div class="chips">' + inUse.map(f => '<span class="chip">' + esc(f) + "</span>").join("") + "</div>" : "") + "</div></div>" +
        ((p.next || []).length ? '<ul class="unlocks">' + p.next.slice(0, 3).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "")
      : '<p class="empty">' + (p.app ? esc(p.app) + ": not scanned yet. " : "") + "Type <b>Maximization</b> in your AI chat to scan which features you use.</p>";

    const log = (s.log || []).slice(0, 8).map(l => '<li><span class="d">' + esc(l.date) + "</span><span>" + esc(l.event) + (l.ev ? '<span class="ev">' + esc(l.ev) + "</span>" : "") +
      '</span><span class="x">+' + num(l.xp) + " XP</span></li>").join("") || '<li class="empty">No completions logged yet.</li>';

    const tracks = TRACKS.map(t => {
      const c = Math.max(0, num(D.counts[t[0]])), th = t[3], r = D.ranks[t[0]];
      const next = r < 4 ? th[r] : null, prv = r ? th[r - 1] : 0;
      return '<div class="track"><div class="track-top"><b>' + t[1] + '</b><span class="rank r' + r + '">' + RANKS[r] + "</span></div>" +
        '<div class="sub">' + c + " " + t[2] + (next == null ? " · max rank" : " · " + RANKS[r + 1] + " at " + next) + "</div>" + bar(next == null ? 100 : ((c - prv) / (next - prv)) * 100) + "</div>";
    }).join("");
    const ins = TIERS.map(t => '<span class="ins' + (D.prestige > 0 || D.level >= t[0] ? " on" : "") + '">' + t[1] + "</span>").join("") +
      (D.prestige ? d3.range(Math.min(D.prestige, 10)).map(k => '<span class="ins prestige on">Prestige ' + (k + 1) + "</span>").join("") : '<span class="ins prestige">Prestige 1</span>');
    const known = BADGES.map(b => b[0]);
    const custom = Object.keys(D.earned).filter(n => known.indexOf(n) < 0).map(n => [n, "Custom badge"]);
    const badges = BADGES.concat(custom).map(b => {
      const e = D.earned[b[0]];
      return '<div class="badge' + (e ? "" : " locked") + '">' + badgeIcon(!!e) + "<b>" + esc(b[0]) + "</b><span>" + (e ? esc(e.date || "Earned") + (e.ev ? " · " + esc(e.ev) : "") : esc(b[1])) + "</span></div>";
    }).join("");

    return '<div class="grid">' +
      panel("s12 hot", "", "", hero) +
      panel("s7", "Skill Matrix", (TREES.length - TREES.filter(t => D.dormant(t[0])).length) + "/8 active", '<div class="matrix"><div class="chart" id="radar"></div><div class="tlist">' + tl + "</div></div>") +
      panel("s5", "Mission Directive", "", '<div class="directive obstacle"><h3>Biggest obstacle</h3>' + (esc(s.obstacle) || '<span class="empty">Not assessed yet.</span>') + "</div>" +
        '<div class="directive"><h3>Next action</h3>' + (esc(s.next_action) || '<span class="empty">Ask for a Status Report.</span>') + "</div>" +
        '<div class="ph sub2"><h2>Score history</h2></div><div class="chart" id="hist"></div>') +
      panel("s7", "Active Operations", quests.filter(q => String(q.status || "active") === "active").length + " active", qHtml) +
      '<div class="s5 stack">' + panel("", "Platform Maximization", "", plat) + panel("", "Mission Log", "", '<ul class="log">' + log + "</ul>") + "</div>" +
      panel("s12", "Rank Insignia", "", '<div class="insignia">' + ins + "</div>" +
        '<div class="ph"><h2>Milestone Tracks</h2></div><div class="tracks">' + tracks + "</div>" +
        '<div class="ph"><h2>Badges</h2><span class="meta">' + Object.keys(D.earned).length + " earned</span></div><div class=\"badges\">" + badges + "</div>") +
      "</div>";
  }

  function operativeView(s, D) {
    const a = D.ar, L = a.look;
    const sw = (key, list, label) => '<div><div class="k">' + label + '</div><div class="sw">' + list.map((col, i) =>
      '<button type="button" data-look="' + key + '" data-val="' + i + '" aria-pressed="' + (L[key] === i) + '" aria-label="' + label + " " + (i + 1) + '" style="background:' + col + '"></button>').join("") + "</div></div>";
    const styles = '<div><div class="k">Hair</div><div class="sw">' + STYLES.map(st =>
      '<button type="button" class="txt" data-look="hair" data-val="' + st[0] + '" aria-pressed="' + (L.hair === st[0]) + '">' + st[1] + "</button>").join("") + "</div></div>";
    const slots = SLOTS.map(sl => {
      const it = ITEM[a.equipped[sl[0]]];
      return '<div class="slot"><div class="k">' + sl[1] + '</div><div class="v' + (it ? "" : " none") + '">' + (it ? esc(it.name) : "Empty") + "</div>" +
        (it ? '<div class="row" style="margin-top:8px"><button type="button" data-unequip="' + sl[0] + '">Unequip</button></div>' : "") + "</div>";
    }).join("");
    const key = D.strongest ? D.strongest[0] : "curiosity";
    const stage = panel("stage hot", "Operative", esc(D.cls[0]), avatar(L, a.equipped, { cls: key, label: (s.player || "Operative") + " avatar" }) +
      '<div class="stage-cap"><div class="nm">' + esc(s.player || "Unnamed") + '</div><div class="ds">' + tierFor(D.level) + " · Level " + D.level + " · " + D.credits.toLocaleString() + " credits</div></div>");
    return '<div class="bay">' + stage + '<div class="stack">' +
      panel("", "Class", "", '<div class="classcard">' + classIcon(key, "#ff2bd6") + "<div><b>" + esc(D.cls[0]) + "</b><p>" + esc(D.cls[1]) +
        " Your class comes from your strongest tree" + (D.strongest ? " (" + esc(D.strongest[1]) + ")" : "") + ", so it changes as you grow.</p></div></div>") +
      panel("", "Loadout", Object.keys(a.equipped).filter(k => a.equipped[k]).length + "/" + SLOTS.length + " slots", '<div class="slots">' + slots + '</div><div class="row"><button class="hot" type="button" data-view="armory">Open Armory</button></div>') +
      panel("", "Appearance", "free", '<div class="look">' + sw("skin", SKINS, "Skin") + styles + sw("hair_color", HAIRS, "Hair color") + sw("accent", ACCENTS, "Neon accent") + "</div>") +
      "</div></div>";
  }

  function armoryView(s, D) {
    const a = D.ar;
    const list = filter === "perks" ? [] : ITEMS.filter(it => filter === "all" || it.slot === filter);
    const sel = ITEM[preview] || null;
    const eq = Object.assign({}, a.equipped);
    if (sel) eq[sel.slot] = sel.id;
    const key = D.strongest ? D.strongest[0] : "curiosity";
    let detail = '<p class="empty" style="margin-top:14px">Pick an item to try it on.</p>';
    if (sel) {
      const own = owns(sel, D), on = a.equipped[sel.slot] === sel.id, short = (sel.price || 0) - D.credits;
      let btn;
      if (sel.need && !own) btn = '<button type="button" disabled>Locked · ' + esc(needText(sel.need)) + "</button>";
      else if (own) btn = on ? '<button type="button" data-unequip="' + sel.slot + '">Unequip</button>' : '<button class="primary" type="button" data-equip="' + sel.id + '">Equip</button>';
      else btn = '<button class="buy" type="button" data-buy="' + sel.id + '"' + (short > 0 ? " disabled" : "") + ">Buy · " + sel.price.toLocaleString() + " CR</button>" +
        (short > 0 ? '<span class="empty">' + short.toLocaleString() + " more credits needed</span>" : "");
      detail = '<div class="detail"><div class="nm">' + esc(sel.name) + '</div><span class="rr rar-' + rarity(sel) + '" style="color:var(--rc);font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase">' +
        rarity(sel) + " · " + SLOTS.find(x => x[0] === sel.slot)[1] + "</span><p>" + esc(sel.d) + '</p><div class="row">' + btn + "</div></div>";
    }
    const stage = panel("stage hot", "Fitting Room", D.credits.toLocaleString() + " CR", avatar(a.look, eq, { cls: key, label: "Avatar preview" }) + detail);
    const filt = '<div class="filters">' + [["all", "All"]].concat(SLOTS, [["perks", "Perks"]]).map(f =>
      '<button type="button" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + "</button>").join("") + "</div>";
    const cards = list.map(it => {
      const own = owns(it, D), on = a.equipped[it.slot] === it.id, lock = it.need && !own;
      const st = on ? '<span class="st eq">EQUIPPED</span>' : own ? '<span class="st own">' + (it.need ? "EARNED" : "OWNED") + "</span>" :
        lock ? '<span class="st lock">🔒 ' + esc(needText(it.need)) + "</span>" : '<span class="st">' + it.price.toLocaleString() + " CR</span>";
      const th = {}; th[it.slot] = it.id;
      return '<button type="button" class="item rar-' + rarity(it) + (lock ? " locked" : "") + '" data-preview="' + it.id + '" aria-pressed="' + (preview === it.id) + '">' +
        '<span class="th">' + avatar(a.look, th, { still: true, label: it.name }) + '</span><span class="body"><span class="nm">' + esc(it.name) + '</span><span class="rr">' + rarity(it) + "</span>" + st + "</span></button>";
    }).join("");
    const perks = filter === "all" || filter === "perks" ? '<div class="ph sub2"><h2>Perks</h2><span class="meta">play-style boosts, never XP</span></div><div class="perks">' + PERKS.map(pk => {
      const have = Math.max(0, Math.floor(num(a.perks[pk.id])));
      return '<div class="perk"><b>' + esc(pk.name) + "</b><p>" + esc(pk.d) + '</p><div class="use">Use it in your AI chat: <code>Use Perk: ' + esc(pk.name) + "</code></div>" +
        '<div class="row" style="margin-top:0"><button class="buy" type="button" data-perk="' + pk.id + '"' + (D.credits < pk.price ? " disabled" : "") + ">Buy · " + pk.price + " CR</button>" +
        (have ? '<span class="ct">× ' + have + " owned</span>" : "") + "</div></div>";
    }).join("") + "</div>" : "";
    return '<div class="bay">' + stage + panel("", "Armory", "Credits = lifetime XP − spent", filt + (cards ? '<div class="items">' + cards + "</div>" : "") + perks) + "</div>";
  }

  function syncBar() {
    return '<div class="sync' + (dirty ? " on" : "") + '" id="sync">' + panel("hot", "", "", '<p><b>Loadout changed.</b> Send the new save code to your AI with <code>Load Game:</code> so your game master keeps your gear.</p>' +
      '<div class="row" style="margin:0"><button class="hot" type="button" id="copy">Copy save code</button><span class="ok" id="copied" hidden>COPIED</span></div>' +
      '<textarea id="codeout" readonly hidden spellcheck="false"></textarea>') + "</div>";
  }

  function render() {
    const D = derive(S);
    // First visit to the armory: equip any gear already earned.
    if (D.ar.fresh) {
      delete D.ar.fresh;
      ITEMS.forEach(it => { if (it.need && unlocked(it, D) && !D.ar.equipped[it.slot]) D.ar.equipped[it.slot] = it.id; });
    }
    ticker(S, D);
    const body = view === "operative" ? operativeView(S, D) : view === "armory" ? armoryView(S, D) : commandView(S, D);
    app.innerHTML = topbar(D) + body + syncBar() +
      '<p class="foot">AI Level Up · <a href="https://github.com/pflan77/ai-level-up">github.com/pflan77/ai-level-up</a> · Your save code stays in this browser.</p>';
    if (view === "command") {
      drawRing(document.getElementById("ring"), (D.into / D.per) * 100, D.level);
      drawRadar(document.getElementById("radar"), D);
      drawHistory(document.getElementById("hist"), S.history);
      const cov = document.getElementById("cov");
      if (cov) { const p = S.platform || {}; drawCoverage(cov, (p.in_use || []).length, clamp(Math.round(num(p.available, 10)), 1, 10)); }
    }
    wire(D);
  }

  function changed() { dirty = true; store(STORE_KEY, JSON.stringify(S)); render(); }

  function wire(D) {
    const a = D.ar;
    app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; store(TAB_KEY, view); render(); window.scrollTo(0, 0); });
    app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
    app.querySelectorAll("[data-preview]").forEach(b => b.onclick = () => { preview = b.dataset.preview; render(); });
    app.querySelectorAll("[data-equip]").forEach(b => b.onclick = () => { const it = ITEM[b.dataset.equip]; a.equipped[it.slot] = it.id; changed(); });
    app.querySelectorAll("[data-unequip]").forEach(b => b.onclick = () => { delete a.equipped[b.dataset.unequip]; changed(); });
    app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
      const it = ITEM[b.dataset.buy];
      if (!it || it.need || owns(it, D) || D.credits < it.price) return;
      a.spent += it.price; a.owned.push(it.id); a.equipped[it.slot] = it.id; changed();
    });
    app.querySelectorAll("[data-perk]").forEach(b => b.onclick = () => {
      const pk = PERKS.find(x => x.id === b.dataset.perk);
      if (!pk || D.credits < pk.price) return;
      a.spent += pk.price; a.perks[pk.id] = Math.max(0, Math.floor(num(a.perks[pk.id]))) + 1; changed();
    });
    app.querySelectorAll("[data-look]").forEach(b => b.onclick = () => {
      const k = b.dataset.look; a.look[k] = k === "hair" ? b.dataset.val : Number(b.dataset.val); changed();
    });
    const swap = document.getElementById("swap");
    if (swap) swap.onclick = () => showLoader("");
    const copy = document.getElementById("copy");
    if (copy) copy.onclick = () => {
      const code = JSON.stringify(S), out = document.getElementById("codeout"), ok = document.getElementById("copied");
      out.value = code; out.hidden = false;
      const done = () => { ok.hidden = false; };
      const fallback = () => { out.select(); try { if (document.execCommand("copy")) done(); } catch (e) { /* user copies by hand */ } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback); else fallback();
    };
  }

  function showLoader(prefill, error) {
    document.getElementById("ticker").innerHTML = "";
    app.innerHTML =
      '<div class="loader"><span class="eyebrow">AI Level Up // Command Center</span>' +
      '<h1 class="glitch" data-text="Jack in">Jack in</h1>' +
      "<p>In your AI chat, type <b>Save Game</b>. Copy the line of JSON it prints and paste it here. Nothing is uploaded; it stays in this browser.</p>" +
      '<label for="code" class="eyebrow" style="color:var(--muted);display:block;margin-bottom:8px">Save code</label>' +
      '<textarea id="code" spellcheck="false" placeholder=\'{"v":2,"player":"...","xp":0, ...}\'>' + esc(prefill) + "</textarea>" +
      '<div class="row"><button class="primary" id="load" type="button">Open command center</button>' +
      '<button id="demo" type="button">Try a demo</button><button id="elite" type="button">Elite demo (Prestige 2)</button>' +
      (error ? '<span class="err" role="alert">' + esc(error) + "</span>" : "") + "</div></div>";
    document.getElementById("load").onclick = () => {
      const text = document.getElementById("code").value;
      try {
        const s = parse(text);
        if (!s) return showLoader(text, "Paste a save code first.");
        start(s, true);
      } catch (e) { showLoader(text, e.message); }
    };
    document.getElementById("demo").onclick = () => start(JSON.parse(JSON.stringify(DEMO)), false);
    document.getElementById("elite").onclick = () => start(JSON.parse(JSON.stringify(ELITE)), false);
  }

  function start(s, save) {
    S = s; dirty = false; preview = null;
    if (save) store(STORE_KEY, JSON.stringify(S));
    render();
  }

  // Start: embedded state first (keeping newer gear from this browser), then the last save used here, then the loader.
  const saved = store(TAB_KEY);
  if (saved === "operative" || saved === "armory") view = saved;
  let s0 = null, local = null;
  try { local = parse(store(STORE_KEY)); } catch (e) { /* ignore a bad stored save */ }
  try { s0 = parse(document.getElementById("ailu-state").textContent); } catch (e) { /* fall back */ }
  if (s0 && local && local.player === s0.player && local.armory && num(local.armory.spent) >= num((s0.armory || {}).spent)) s0.armory = local.armory;
  s0 = s0 || local;
  if (s0) start(s0, false); else showLoader("");
})();
</script>
</body>
</html>
