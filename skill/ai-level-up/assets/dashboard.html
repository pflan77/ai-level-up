<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Level Up Command Center</title>
<meta name="description" content="Paste your AI Level Up save code to see your level, XP, skill trees, quests and badges.">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b12;
    --panel: #0d1420;
    --panel-2: #111b2b;
    --line: #1e2b40;
    --text: #dce6f2;
    --muted: #7d8ba1;
    --accent: #35d6ff;
    --accent-2: #8b7bff;
    --good: #3ee08f;
    --warn: #ffb547;
    --bad: #ff5c7a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(53, 214, 255, .08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(139, 123, 255, .08), transparent 60%);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  .eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  .panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    position: relative;
  }
  .panel h2 { font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; }
  .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
  @media (max-width: 640px) { .tree { grid-template-columns: 120px 1fr 58px; } }
  @media (max-width: 860px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } }

  /* Header */
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
  @media (max-width: 640px) { .hero { grid-template-columns: auto 1fr; } .hero .score-box { grid-column: span 2; } }
  .lvl-ring { width: 96px; height: 96px; position: relative; }
  .lvl-ring svg { transform: rotate(-90deg); }
  .lvl-ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .lvl-ring .num b { font: 700 30px/1 var(--mono); display: block; }
  .lvl-ring .num span { font: 600 9px/1 var(--mono); letter-spacing: .16em; color: var(--muted); }
  .callsign { font-size: 26px; letter-spacing: .01em; overflow-wrap: anywhere; }
  .tier { display: inline-block; margin-top: 6px; font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 9px; border-radius: 999px; border: 1px solid rgba(53, 214, 255, .35); color: var(--accent); background: rgba(53, 214, 255, .06); }
  .xpline { margin-top: 12px; }
  .xpmeta { display: flex; justify-content: space-between; font: 12px/1 var(--mono); color: var(--muted); margin-bottom: 6px; gap: 8px; }
  .bar { height: 8px; border-radius: 99px; background: #182437; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 12px rgba(53, 214, 255, .45); }
  .score-box { text-align: right; }
  @media (max-width: 640px) { .score-box { text-align: left; } }
  .score { font: 700 44px/1 var(--mono); }
  .score small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .delta { font: 600 13px/1 var(--mono); margin-top: 6px; }
  .mirror { margin-top: 10px; font: 600 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
  .mirror i { font-style: normal; color: var(--accent); letter-spacing: .2em; margin: 0 6px; }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }

  /* Trees */
  .tree { display: grid; grid-template-columns: 170px 1fr 64px; gap: 12px; align-items: center; padding: 7px 0; }
  .tree .name { font-size: 14px; }
  .tree .val { font: 600 13px/1 var(--mono); text-align: right; }
  .tree.weak .name::after { content: "WEAKEST"; display: block; margin-top: 3px; font: 600 9px/1 var(--mono); letter-spacing: .12em; color: var(--warn); }
  .tree.dormant .name, .tree.dormant .val { color: var(--muted); }
  .tree.dormant .val { font-size: 10px; letter-spacing: .12em; }
  .tree.weak .bar > i { background: linear-gradient(90deg, #a8661b, var(--warn)); box-shadow: 0 0 12px rgba(255, 181, 71, .4); }

  /* Quests */
  .qgroup + .qgroup { margin-top: 16px; }
  .qlabel { font: 600 10px/1 var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .quest { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: rgba(255, 255, 255, .015); }
  .quest + .quest { margin-top: 8px; }
  .quest.boss { border-color: rgba(255, 92, 122, .4); background: rgba(255, 92, 122, .04); }
  .quest.done { opacity: .6; }
  .quest.locked { opacity: .45; }
  .qtop { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
  .qid { font: 600 11px/1 var(--mono); color: var(--accent); margin-right: 8px; }
  .qtitle { font-weight: 600; }
  .qreward { font: 600 11px/1.3 var(--mono); color: var(--good); white-space: nowrap; }
  .qcrit { color: var(--muted); font-size: 13px; margin: 6px 0 8px; }
  .qprog { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font: 12px/1 var(--mono); color: var(--muted); }

  /* Platform */
  .stack { display: grid; gap: 16px; align-content: start; }
  .plat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .plat-app { font-weight: 650; font-size: 17px; }
  .plat-cov { font: 600 13px/1 var(--mono); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font: 11px/1 var(--mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .unlocks { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: u; }
  .unlocks li { counter-increment: u; position: relative; padding: 6px 0 6px 28px; font-size: 13px; border-top: 1px dashed var(--line); }
  .unlocks li::before { content: counter(u); position: absolute; left: 0; top: 7px; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center; font: 700 10px/1 var(--mono); background: rgba(53, 214, 255, .12); color: var(--accent); }

  /* Milestones + insignia */
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .track { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .track-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .track b { font-size: 13px; }
  .rank { font: 700 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px solid currentColor; }
  .r0 { color: var(--muted); opacity: .7; } .r1 { color: #d08b5b; } .r2 { color: #c3ccd8; } .r3 { color: #f5c542; } .r4 { color: #9fe8ff; text-shadow: 0 0 10px rgba(159, 232, 255, .6); }
  .track .sub { font: 11px/1.3 var(--mono); color: var(--muted); margin: 6px 0 8px; }
  .insignia { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .ins { font: 600 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); opacity: .45; }
  .ins.on { opacity: 1; color: var(--accent); border-color: rgba(53, 214, 255, .4); background: rgba(53, 214, 255, .06); }
  .ins.prestige.on { color: #f5c542; border-color: rgba(245, 197, 66, .45); background: rgba(245, 197, 66, .07); }
  .stars { color: #f5c542; margin-left: 6px; letter-spacing: .1em; }

  /* Badges */
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .badge { border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; text-align: center; }
  .badge .ico { font-size: 22px; line-height: 1; display: block; margin-bottom: 8px; color: var(--accent); text-shadow: 0 0 14px rgba(53, 214, 255, .6); }
  .badge b { display: block; font-size: 13px; }
  .badge span { display: block; font: 11px/1.3 var(--mono); color: var(--muted); margin-top: 4px; }
  .badge.locked { opacity: .38; filter: grayscale(1); }
  .badge.locked .ico { text-shadow: none; color: var(--muted); }

  /* Directive + log */
  .directive { border-left: 3px solid var(--accent); padding-left: 12px; }
  .directive + .directive { margin-top: 14px; }
  .directive.obstacle { border-color: var(--warn); }
  .directive h3 { font: 600 10px/1 var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 86px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .log li:last-child { border-bottom: 0; }
  .log .d { font: 12px/1.4 var(--mono); color: var(--muted); }
  .log .x { font: 600 12px/1.4 var(--mono); color: var(--good); white-space: nowrap; }
  .ev { font: 600 9px/1 var(--mono); padding: 2px 4px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .empty { color: var(--muted); font-size: 13px; }

  /* Loader */
  .loader { max-width: 680px; margin: 8vh auto 0; }
  .loader h1 { font-size: 30px; margin: 10px 0 8px; }
  .loader p { color: var(--muted); margin: 0 0 18px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical; border-radius: 12px; border: 1px solid var(--line);
    background: #0a111c; color: var(--text); font: 13px/1.5 var(--mono); padding: 14px;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    font: 600 13px/1 var(--sans); padding: 11px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121a; }
  .err { color: var(--bad); font-size: 13px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  .stamp { font: 12px/1 var(--mono); color: var(--muted); }
  .foot { margin-top: 28px; text-align: center; font: 11px/1.4 var(--mono); color: var(--muted); }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<!--
  AI Level Up command center.
  Paste a save code on the page, or embed one here so the page opens straight to the dashboard:
  put the save-code JSON between the script tags below.
-->
<script id="ailu-state" type="application/json"></script>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "ai-level-up:save";
  var TREES = [
    ["curiosity", "Curiosity"], ["context", "Context & Personalization"], ["connecting", "Connecting Tools"], ["judgment", "Judgment"],
    ["application", "Application"], ["teaching", "Teaching"], ["systems", "Systems"], ["shipping", "Shipping"]
  ];
  var BADGES = [
    ["First Contact", "First quest done"], ["Scout", "Kept or killed a tool"],
    ["Mirror Match", "5/5 Mirror Test"], ["Fact Checker", "Caught an AI error"],
    ["Workflow Engineer", "First tested workflow"], ["Connected", "AI in a daily tool, 1 week"],
    ["Systems Architect", "Reliable connected system"], ["Boss Slayer", "First boss defeated"]
  ];
  var TRACKS = [
    ["published", "Transmitter", "items published", [1, 10, 50, 100]],
    ["quests", "Questrunner", "quests done", [10, 50, 150, 500]],
    ["streak", "Streak", "weeks in a row", [4, 12, 26, 52]],
    ["taught", "Mentor", "people taught", [1, 10, 50, 250]],
    ["hours", "Force Multiplier", "hours saved / week", [1, 5, 10, 20]],
    ["features", "Full Throttle", "feature areas in use", [4, 6, 8, 10]]
  ];
  var RANKS = ["Unranked", "Bronze", "Silver", "Gold", "Platinum"];
  var TIERS = [[1, "Initiate"], [5, "Builder"], [10, "Operator"], [15, "Systems Architect"], [20, "Commander"], [30, "Vanguard"]];
  var QTYPES = [["main", "Main Quests"], ["boss", "Boss Battles"], ["weekly", "Weekly"], ["daily", "Daily"]];

  var DEMO = {
    v: 1, player: "Nova", started: "2026-11-01", last_eval: "2026-11-08", score: 6.8, prev_score: 6.4, xp: 1130,
    trees: { curiosity: 8.2, context: 7.4, connecting: 5.1, judgment: 6.3, application: 6.9, teaching: null, systems: 5.6, shipping: 7.2 },
    platform: { app: "ChatGPT", plan: "Plus", in_use: ["Memory", "Projects", "Canvas", "Voice", "File uploads"], available: 10,
      next: ["Connected apps: link Google Drive so research notes are one prompt away", "Tasks: a Monday 8am newsletter ideas briefing", "Custom GPT: turn the house-style prompt into a shareable assistant"] },
    mirror: { score: 3, date: "2026-11-05" },
    counts: { published: 12, quests: 9, streak: 2, taught: 0, hours: 1, features: 5 },
    badges: [
      { name: "First Contact", date: "2026-11-02", ev: "V", earned: true },
      { name: "Fact Checker", date: "2026-11-03", ev: "V", earned: true },
      { name: "Scout", date: "2026-11-06", ev: "R", earned: true }
    ],
    quests: [
      { id: "MQ1", type: "main", title: "Launch the newsletter", criteria: "4 issues sent to real subscribers", done: 2, total: 4, reward: "+100 XP per issue", status: "active" },
      { id: "MQ2", type: "main", title: "Two-model research workflow", criteria: "Written handoff, used on 5 tasks in 7 days", done: 1, total: 5, reward: "+150 / +200 XP", status: "active" },
      { id: "BB1", type: "boss", title: "The Autonomous Inbox", criteria: "Triage system in use for a week, time saved logged", done: 0, total: 1, reward: "+250 +200 XP", status: "locked" },
      { id: "W1", type: "weekly", title: "Ship 3 AI-assisted pieces", criteria: "3 items delivered by Sunday", done: 2, total: 3, reward: "+100 XP", status: "active" },
      { id: "D1", type: "daily", title: "Turn one prompt into a template", criteria: "Saved and reused once", done: 0, total: 1, reward: "+20 XP", status: "active" }
    ],
    log: [
      { date: "2026-11-07", id: "MQ1-2", event: "Newsletter issue 2 sent", xp: 100, ev: "V" },
      { date: "2026-11-06", id: "SC-1", event: "Scout verdict: kept a transcription tool", xp: 20, ev: "R" },
      { date: "2026-11-03", id: "MQ1-1", event: "Newsletter issue 1 sent", xp: 100, ev: "V" }
    ],
    history: [
      { date: "2026-11-01", score: 6.4, reason: "Onboarding calibration" },
      { date: "2026-11-08", score: 6.8, reason: "Two issues shipped on schedule" }
    ],
    obstacle: "Connecting Tools is the weakest tree: research notes and drafts still move between apps by copy-paste.",
    next_action: "Write a 5-line handoff spec for MQ2 and run it on tomorrow's research task."
  };

  var ELITE = JSON.parse(JSON.stringify(DEMO));
  ELITE.player = "Vega"; ELITE.prestige = 2; ELITE.xp = 16840; ELITE.season_xp = 2950; ELITE.score = 9.7; ELITE.prev_score = 9.6;
  ELITE.trees = { curiosity: 9.8, context: 9.7, connecting: 9.5, judgment: 9.4, application: 9.6, teaching: 9.7, systems: 9.5, shipping: 9.8 };
  ELITE.mirror = { score: 5, date: "2026-10-20" };
  ELITE.counts = { published: 214, quests: 388, streak: 61, taught: 140, hours: 14, features: 10 };
  ELITE.platform.in_use = ["Memory", "Projects", "GPTs", "Files", "Connectors", "Deep research", "Canvas", "Voice", "Agents", "Data"];
  ELITE.platform.next = [];
  ELITE.badges = BADGES.map(function (b) { return { name: b[0], date: "2026", ev: "V" }; });
  ELITE.quests = [{ id: "PM2", type: "boss", title: "Mandate II: The Franchise", criteria: "3 teams run your workflow weekly without you", done: 1, total: 3, reward: "Unlocks Prestige III", status: "active" }];
  ELITE.obstacle = "Impact still routes through you; two of three teams need a hands-on kickoff.";
  ELITE.next_action = "Record a 10-minute onboarding walkthrough so team three can start without a live session.";

  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : (d || 0); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function tierFor(level) {
    if (level >= 30) return "Vanguard";
    if (level >= 20) return "Commander";
    if (level >= 15) return "Systems Architect";
    if (level >= 10) return "Operator";
    if (level >= 5) return "Builder";
    return "Initiate";
  }
  function store(op, val) {
    try {
      if (op === "get") return localStorage.getItem(STORE_KEY);
      if (op === "set") localStorage.setItem(STORE_KEY, val);
      if (op === "del") localStorage.removeItem(STORE_KEY);
    } catch (e) { /* storage unavailable: page still works */ }
    return null;
  }

  // Accept the raw JSON, or JSON wrapped in a code fence or surrounding chat text.
  function parse(text) {
    var t = String(text || "").trim();
    if (!t) return null;
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a < 0 || b <= a) throw new Error("No save code found. It starts with { and ends with }.");
    var s = JSON.parse(t.slice(a, b + 1));
    if (typeof s !== "object" || s === null || !("xp" in s)) throw new Error("That JSON isn't an AI Level Up save code.");
    return s;
  }

  function bar(pct) { return '<div class="bar"><i style="width:' + clamp(pct, 0, 100).toFixed(1) + '%"></i></div>'; }

  function ring(pct) {
    var r = 42, c = 2 * Math.PI * r, off = c * (1 - clamp(pct, 0, 100) / 100);
    return '<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="#182437" stroke-width="7"/>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"/>' +
      '<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#35d6ff"/></linearGradient></defs></svg>';
  }

  function sparkline(hist) {
    var pts = (hist || []).map(function (h) { return num(h.score); });
    if (pts.length < 2) return '<p class="empty">Score history appears after your next evaluation.</p>';
    var w = 300, h = 70, lo = Math.min.apply(null, pts) - 0.3, hi = Math.max.apply(null, pts) + 0.3;
    var xy = pts.map(function (p, i) {
      return [(i / (pts.length - 1)) * (w - 12) + 6, h - 6 - ((p - lo) / (hi - lo)) * (h - 12)];
    });
    var d = xy.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var dots = xy.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#35d6ff"/>'; }).join("");
    var last = hist[hist.length - 1];
    return '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="' + h + '" role="img" aria-label="Score history">' +
      '<path d="' + d + '" fill="none" stroke="#35d6ff" stroke-width="2"/>' + dots + "</svg>" +
      '<p class="empty" style="margin:6px 0 0">' + esc(last.date) + " · " + esc(last.reason) + "</p>";
  }

  function render(s) {
    var xp = Math.max(0, Math.floor(num(s.xp)));
    var prestige = Math.max(0, Math.floor(num(s.prestige)));
    var season = s.season_xp == null ? xp : Math.max(0, Math.floor(num(s.season_xp)));
    var per = 200 + 100 * prestige;
    var level = 1 + Math.floor(season / per);
    var into = season % per;
    var pct = (into / per) * 100;
    var stars = prestige ? '<span class="stars" title="Prestige ' + prestige + '">' + (prestige > 5 ? "★×" + prestige : "★★★★★".slice(0, prestige)) + "</span>" : "";
    var score = num(s.score), prev = s.prev_score == null ? null : num(s.prev_score);
    var delta = prev == null ? 0 : Math.round((score - prev) * 10) / 10;
    var dcls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    var dtxt = prev == null ? "baseline" : (delta > 0 ? "▲ " : delta < 0 ? "▼ " : "■ ") + Math.abs(delta).toFixed(1) + " from " + prev.toFixed(1);

    var trees = s.trees || {};
    if (!("connecting" in trees) && "orchestration" in trees) trees.connecting = trees.orchestration;
    function isDormant(k) { return trees[k] == null || trees[k] === "dormant"; }
    var weakest = null;
    TREES.forEach(function (t) { if (!isDormant(t[0]) && (!weakest || num(trees[t[0]]) < num(trees[weakest[0]]))) weakest = t; });
    var treeHtml = TREES.map(function (t) {
      if (isDormant(t[0])) {
        return '<div class="tree dormant"><span class="name">' + t[1] + "</span>" + bar(0) + '<span class="val">DORMANT</span></div>';
      }
      var v = num(trees[t[0]]);
      return '<div class="tree' + (t === weakest ? " weak" : "") + '"><span class="name">' + t[1] + "</span>" +
        bar(v * 10) + '<span class="val">' + v.toFixed(1) + "</span></div>";
    }).join("");

    var counts = s.counts || {};
    var trackHtml = TRACKS.map(function (t) {
      var c = Math.max(0, num(counts[t[0]])), th = t[3], r = 0;
      while (r < 4 && c >= th[r]) r++;
      var next = r < 4 ? th[r] : null, prev = r ? th[r - 1] : 0;
      var prog = next == null ? 100 : ((c - prev) / (next - prev)) * 100;
      return '<div class="track"><div class="track-top"><b>' + t[1] + '</b><span class="rank r' + r + '">' + RANKS[r] + "</span></div>" +
        '<div class="sub">' + c + " " + t[2] + (next == null ? " · max rank" : " · next " + RANKS[r + 1] + " at " + next) + "</div>" + bar(prog) + "</div>";
    }).join("");
    var insHtml = TIERS.map(function (t) {
      var on = prestige > 0 || level >= t[0];
      return '<span class="ins' + (on ? " on" : "") + '">' + t[1] + "</span>";
    }).join("") + (prestige ? Array.apply(null, Array(Math.min(prestige, 10))).map(function (_, k) {
      return '<span class="ins prestige on">Prestige ' + (k + 1) + "</span>";
    }).join("") : '<span class="ins prestige">Prestige 1</span>');

    var m = s.mirror || {};
    var mScore = clamp(Math.round(num(m.score)), 0, 5);
    var mirrorHtml = m.date || m.score
      ? '<div class="mirror">MIRROR TEST<i>' + "◉◉◉◉◉".slice(0, mScore) + "○○○○○".slice(0, 5 - mScore) + "</i>" + mScore + "/5</div>"
      : '<div class="mirror">MIRROR TEST<i>○○○○○</i>not run</div>';

    var p = s.platform || {};
    var inUse = Array.isArray(p.in_use) ? p.in_use : [];
    var avail = Math.max(1, num(p.available, 10));
    var platHtml = p.app
      ? '<div class="plat-head"><span class="plat-app">' + esc(p.app) + (p.plan ? " · " + esc(p.plan) : "") + "</span>" +
        '<span class="plat-cov">' + inUse.length + "/" + avail + "</span></div>" + bar((inUse.length / avail) * 100) +
        (inUse.length ? '<div class="chips">' + inUse.map(function (f) { return '<span class="chip">' + esc(f) + "</span>"; }).join("") + "</div>" : "") +
        ((p.next || []).length ? '<ul class="unlocks">' + p.next.slice(0, 3).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" : "")
      : '<p class="empty">Type <b>Maximization</b> in your AI chat to scan which features you use.</p>';

    var quests = Array.isArray(s.quests) ? s.quests : [];
    var questHtml = QTYPES.map(function (qt) {
      var list = quests.filter(function (q) { return (q.type || "main") === qt[0]; });
      if (!list.length) return "";
      return '<div class="qgroup"><div class="qlabel">' + qt[1] + "</div>" + list.map(function (q) {
        var total = Math.max(1, num(q.total, 1)), done = clamp(num(q.done), 0, total);
        var st = q.status || "active";
        return '<div class="quest ' + esc(qt[0]) + " " + esc(st) + '"><div class="qtop"><div><span class="qid">' + esc(q.id) + "</span>" +
          '<span class="qtitle">' + esc(q.title) + "</span></div>" + '<span class="qreward">' + esc(q.reward) + "</span></div>" +
          (q.criteria ? '<div class="qcrit">' + esc(q.criteria) + "</div>" : "") +
          '<div class="qprog">' + bar((done / total) * 100) + "<span>" +
          (st === "done" ? "COMPLETE" : st === "locked" ? "LOCKED" : done + "/" + total) + "</span></div></div>";
      }).join("") + "</div>";
    }).join("") || '<p class="empty">No quests yet. Ask your game master for a Quest Board.</p>';

    var earned = {};
    (s.badges || []).forEach(function (b) { if (b && b.earned !== false) earned[b.name] = b; });
    var known = BADGES.map(function (b) { return b[0]; });
    var custom = (s.badges || []).filter(function (b) { return b && b.earned !== false && known.indexOf(b.name) < 0; })
      .map(function (b) { return [b.name, "Custom badge"]; });
    var badgeHtml = BADGES.concat(custom).map(function (b) {
      var e = earned[b[0]];
      return '<div class="badge' + (e ? "" : " locked") + '"><span class="ico">' + (e ? "◆" : "◇") + "</span><b>" + esc(b[0]) + "</b>" +
        "<span>" + (e ? esc(e.date || "Earned") + (e.ev ? " · " + esc(e.ev) : "") : esc(b[1])) + "</span></div>";
    }).join("");

    var logHtml = (s.log || []).slice(0, 8).map(function (l) {
      return '<li><span class="d">' + esc(l.date) + "</span><span>" + esc(l.event) + (l.ev ? '<span class="ev">' + esc(l.ev) + "</span>" : "") +
        '</span><span class="x">+' + num(l.xp) + " XP</span></li>";
    }).join("") || '<li class="empty">No completions logged yet.</li>';

    app.innerHTML =
      '<div class="topbar"><span class="eyebrow">AI Level Up // Command Center</span>' +
      '<span class="stamp">Last eval ' + esc(s.last_eval || "—") + ' &nbsp; <button id="swap" type="button">Load another save</button></span></div>' +
      '<div class="grid">' +
        '<section class="panel s12"><div class="hero">' +
          '<div class="lvl-ring">' + ring(pct) + '<div class="num"><div><span>LEVEL</span><b>' + level + "</b></div></div></div>" +
          "<div><h1 class=\"callsign\">" + esc(s.player || "Unnamed Pilot") + '</h1><span class="tier">' + tierFor(level) + "</span>" + stars +
            '<div class="xpline"><div class="xpmeta"><span>' + (prestige ? season.toLocaleString() + " season XP · " : "") + xp.toLocaleString() + " lifetime XP</span><span>" + into + " / " + per + " → LVL " + (level + 1) + "</span></div>" +
            bar(pct) + "</div></div>" +
          '<div class="score-box"><div class="eyebrow" style="color:var(--muted)">Power Score</div><div class="score">' + score.toFixed(1) +
            '<small> / 10</small></div><div class="delta ' + dcls + '">' + dtxt + "</div>" + mirrorHtml + "</div>" +
        "</div></section>" +
        '<section class="panel s7"><h2>Skill Trees</h2>' + treeHtml + "</section>" +
        '<section class="panel s5"><h2>Mission Directive</h2>' +
          '<div class="directive obstacle"><h3>Biggest obstacle</h3>' + (esc(s.obstacle) || '<span class="empty">Not assessed yet.</span>') + "</div>" +
          '<div class="directive"><h3>Next action</h3>' + (esc(s.next_action) || '<span class="empty">Ask for a Status Report.</span>') + "</div>" +
          '<div style="margin-top:18px"><h2>Score history</h2>' + sparkline(s.history) + "</div>" +
        "</section>" +
        '<section class="panel s7"><h2>Active Operations</h2>' + questHtml + "</section>" +
        '<div class="s5 stack"><section class="panel"><h2>Platform Maximization</h2>' + platHtml + "</section>" +
        '<section class="panel"><h2>Mission Log</h2><ul class="log">' + logHtml + "</ul></section></div>" +
        '<section class="panel s12"><h2>Rank Insignia</h2><div class="insignia">' + insHtml + "</div>" +
          "<h2>Milestone Tracks</h2><div class=\"tracks\">" + trackHtml + "</div>" +
          "<h2>Badges · " + Object.keys(earned).length + " earned</h2><div class=\"badges\">" + badgeHtml + "</div></section>" +
      "</div>" +
      '<p class="foot">AI Level Up · <a href="https://github.com/pflan77/ai-level-up">github.com/pflan77/ai-level-up</a> · Your save code stays in this browser.</p>';

    document.getElementById("swap").onclick = function () { showLoader(""); };
  }

  function showLoader(prefill, error) {
    app.innerHTML =
      '<div class="loader"><span class="eyebrow">AI Level Up // Command Center</span>' +
      "<h1>Load your save code</h1>" +
      "<p>In your AI chat, type <b>Save Game</b>. Copy the line of JSON it prints and paste it here. Nothing is uploaded; it stays in this browser.</p>" +
      '<label for="code" class="eyebrow" style="color:var(--muted);display:block;margin-bottom:8px">Save code</label>' +
      '<textarea id="code" spellcheck="false" placeholder=\'{"v":1,"player":"...","xp":0, ...}\'>' + esc(prefill) + "</textarea>" +
      '<div class="row"><button class="primary" id="load" type="button">Open command center</button>' +
      '<button id="demo" type="button">Try a demo</button>' +
      '<button id="elite" type="button">Elite demo (Prestige 2)</button>' +
      (error ? '<span class="err" role="alert">' + esc(error) + "</span>" : "") + "</div></div>";
    document.getElementById("load").onclick = function () {
      var text = document.getElementById("code").value;
      try {
        var s = parse(text);
        if (!s) return showLoader(text, "Paste a save code first.");
        store("set", JSON.stringify(s));
        render(s);
      } catch (e) { showLoader(text, e.message); }
    };
    document.getElementById("demo").onclick = function () { render(DEMO); };
    document.getElementById("elite").onclick = function () { render(ELITE); };
  }

  // Start: embedded state first, then the last save code used in this browser, then the loader.
  var embedded = document.getElementById("ailu-state").textContent;
  try {
    var s0 = parse(embedded) || parse(store("get"));
    if (s0) { render(s0); return; }
  } catch (e) { /* fall through to the loader */ }
  showLoader("");
})();
</script>
</body>
</html>
